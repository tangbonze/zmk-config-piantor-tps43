# Enable Central split role and ZMK Studio on whichever half is chosen as Central
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# KeyBeacon (KBP 1.2) — 仅在主手 (Central) 启用，通过 BLE GATT 上报实时状态给桌面端：
#   - 层名 + 修饰键状态 (AA440AA1)
#   - 主机连接 / Profile 槽位 / 分体链路 / USB or BLE 输出端点 (AA440AA2)
#   - 主/从手双半电量 (AA440AA3)
#   - 每连接 Host-Link 归属槽位 (AA440AA4)
CONFIG_ZMK_KEYBEACON=y
CONFIG_ZMK_KEYBEACON_CONNECTIVITY=y
CONFIG_ZMK_KEYBEACON_BATTERY=y
CONFIG_ZMK_KEYBEACON_HOST_LINK=y
